# Runs every test suite on each pull request and on main, so nothing reaches the server untested.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: ${{ matrix.suite }}${{ matrix.postgres && ' (PostgreSQL)' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [services/inventory, services/payments, services/dispatch, services/notify,
                services/shelf,
                apps/dashboard, apps/scan_and_go, apps/storefront, apps/rider]
        postgres: [false]
        include:
          # The services that store data also run against PostgreSQL, as on the server.
          - {suite: services/inventory, postgres: true}
          - {suite: services/payments, postgres: true}
          - {suite: services/dispatch, postgres: true}
          - {suite: services/notify, postgres: true}
    services:
      postgres:
        image: ${{ matrix.postgres && 'postgres:17-alpine' || '' }}
        env: {POSTGRES_USER: smart, POSTGRES_PASSWORD: test, POSTGRES_DB: smartshopping}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smart" --health-interval 3s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.suite }}/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
        env:
          TEST_DATABASE_URL: ${{ matrix.postgres && 'postgresql://smart:test@localhost:5432/smartshopping' || '' }}

  firmware:
    name: shelf node firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd hardware/firmware/shelf_node/test && sh run_tests.sh

  deploy-config:
    name: deploy config and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts
        run: shellcheck scripts/*.sh
      - name: docker-compose.yml
        run: DB_PASSWORD=x CALLBACK_SECRET=y docker compose config -q
      - name: Caddyfile
        run: |
          docker run --rm -e SITE_ADDRESS=:80 -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v "$PWD/deploy/staff/users.example:/etc/caddy/staff/users:ro" \
            -v "$PWD/deploy/staff/roles.example:/etc/caddy/staff/roles:ro" \
            caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
