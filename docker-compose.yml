# All the services behind one HTTPS front door.
# Local demo:   ./scripts/demo.sh  ->  http://localhost (simulators instead of Safaricom, Paystack and shelf hardware)
# DigitalOcean: scripts/server-setup.sh, scripts/configure.sh, then scripts/deploy.sh (see deploy/README.md)

# Docker keeps every container's output; cap it so a busy store can't fill the disk (50 MB per service).
x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "5"}

services:
  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    logging: *logging
    ports: ["80:80", "443:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Staff logins and roles: create them with scripts/staff.sh add <name> --manager
      - ./deploy/staff:/etc/caddy/staff:ro
      - caddy-data:/data
    depends_on: [inventory, payments, dispatch, dashboard, scan_and_go, storefront, rider]

  # The shared database. Inventory and Payments each keep their tables in their own schema.
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: smartshopping
      POSTGRES_USER: smartshopping
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env to a long random string (see deploy/README.md)}
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartshopping -d smartshopping"]
      interval: 3s
      timeout: 3s
      retries: 20

  inventory:
    build: services/inventory
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      DATABASE_URL: postgresql://smartshopping:${DB_PASSWORD}@db:5432/smartshopping
      DATABASE_SCHEMA: inventory
      UVICORN_ROOT_PATH: /inventory
    depends_on:
      db: {condition: service_healthy}

  payments:
    build: services/payments
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      DARAJA_ENV: ${DARAJA_ENV:-sandbox}
      DARAJA_CONSUMER_KEY: ${DARAJA_CONSUMER_KEY:-}
      DARAJA_CONSUMER_SECRET: ${DARAJA_CONSUMER_SECRET:-}
      DARAJA_SHORTCODE: ${DARAJA_SHORTCODE:-174379}
      DARAJA_PASSKEY: ${DARAJA_PASSKEY:-}
      DARAJA_TRANSACTION_TYPE: ${DARAJA_TRANSACTION_TYPE:-CustomerPayBillOnline}
      DARAJA_PARTY_B: ${DARAJA_PARTY_B:-}
      DARAJA_SIM_URL: http://mpesa_sim:8099
      CARD_PROVIDER: ${CARD_PROVIDER:-}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      CARD_SIM_URL: http://card_sim:8098
      # Callbacks come back through the proxy. Without a public address (simulator demo) that's the proxy
      # inside Docker; the Payments Service refuses to start on sandbox/production without an https:// one.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://proxy}/pay
      CALLBACK_SECRET: ${CALLBACK_SECRET:?Set CALLBACK_SECRET in .env to a long random string (see deploy/README.md)}
      INVENTORY_URL: http://inventory:8010
      UVICORN_ROOT_PATH: /pay
      DATABASE_URL: postgresql://smartshopping:${DB_PASSWORD}@db:5432/smartshopping
      DATABASE_SCHEMA: payments
    depends_on:
      db: {condition: service_healthy}
      inventory: {condition: service_started}

  # Deliveries of online orders and the store's riders.
  dispatch:
    build: services/dispatch
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8050/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      DATABASE_URL: postgresql://smartshopping:${DB_PASSWORD}@db:5432/smartshopping
      DATABASE_SCHEMA: dispatch
      INVENTORY_URL: http://inventory:8010
      DELIVERY_AREAS: ${DELIVERY_AREAS:-}
      UVICORN_ROOT_PATH: /dispatch
    depends_on:
      db: {condition: service_healthy}
      inventory: {condition: service_started}

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8020/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      STORE_ID: ${STORE_ID:-001}
      INVENTORY_URL: http://inventory:8010
      DISPATCH_URL: http://dispatch:8050
      UVICORN_ROOT_PATH: /dashboard
    volumes: [dashboard-data:/data]
    depends_on: [inventory, dispatch]

  scan_and_go:
    build: apps/scan_and_go
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8030/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      STORE_ID: ${STORE_ID:-001}
      STORE_NAME: ${STORE_NAME:-Smart Shopping}
      INVENTORY_URL: http://inventory:8010
      PAYMENTS_URL: http://payments:8000
      UVICORN_ROOT_PATH: /shop
    depends_on: [inventory, payments]

  # Online shop: order online, pay with M-Pesa, collect in store. Reads the shelf events (read-only) so it
  # doesn't promise items shoppers have just picked up.
  storefront:
    build: apps/storefront
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8040/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      STORE_ID: ${STORE_ID:-001}
      STORE_NAME: ${STORE_NAME:-Smart Shopping}
      INVENTORY_URL: http://inventory:8010
      PAYMENTS_URL: http://payments:8000
      DISPATCH_URL: http://dispatch:8050
      SHELF_EVENTS_PATH: /shelf/shelf_events.jsonl
      UVICORN_ROOT_PATH: /store
    volumes: [dashboard-data:/shelf:ro]
    depends_on: [inventory, payments, dispatch]

  # Riders' phone app: their deliveries, and the customer's code to finish each one.
  rider:
    build: apps/rider
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8060/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      STORE_ID: ${STORE_ID:-001}
      STORE_NAME: ${STORE_NAME:-Smart Shopping}
      DISPATCH_URL: http://dispatch:8050
      INVENTORY_URL: http://inventory:8010
      UVICORN_ROOT_PATH: /rider
    depends_on: [dispatch, inventory]

  # Stand-in for Safaricom Daraja (tools/mpesa_simulator). Only runs with the "demo" profile.
  mpesa_sim:
    profiles: [demo]
    build: tools/mpesa_simulator
    restart: unless-stopped
    logging: *logging
    environment:
      SIM_DELAY_S: ${SIM_DELAY_S:-3}

  # Stand-in for Paystack's card checkout (tools/card_simulator). Only runs with the "demo" profile.
  # Customers' browsers reach its test payment page at /card-sim/; its webhooks go through the proxy.
  card_sim:
    profiles: [demo]
    build: tools/card_simulator
    restart: unless-stopped
    logging: *logging
    environment:
      CARD_SIM_PUBLIC_URL: /card-sim
      # Like Paystack, it posts through the front door: the proxy inside Docker locally, the domain on a server.
      CARD_SIM_WEBHOOK_URL: ${PUBLIC_BASE_URL:-http://proxy}/pay/payments/card/webhook

  # Simulated shelf sensors (services/shelf, live mode). Writes shelf events where the dashboard reads them.
  shelf_sim:
    profiles: [demo]
    build: services/shelf
    restart: unless-stopped
    logging: *logging
    environment:
      PYTHONUNBUFFERED: "1"
    command: ["python", "-m", "shelf.simulator", "--config", "config.example.json",
              "--live", "/data/shelf_events.jsonl", "--interval", "${SHELF_SIM_INTERVAL_S:-12}"]
    volumes: [dashboard-data:/data]

volumes:
  caddy-data:
  db-data:
  dashboard-data:
