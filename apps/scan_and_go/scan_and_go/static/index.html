<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e6b47">
<title>Scan &amp; Go</title>
<style>
  /* Same look as the online shop (apps/storefront). */
  :root {
    --bg: #f5f3ee; --panel: #ffffff; --text: #17201b; --muted: #66706a; --line: #e7e3da; --soft: #efece5;
    --accent: #0e6b47; --accent-2: #138a5c; --accent-text: #ffffff; --ok-bg: #e3f2ea; --orange: #ff8a3d;
    --warn: #9a5b00; --warn-bg: #fff4dc; --bad: #b42318; --bad-bg: #fdecea;
    --done-bg: linear-gradient(150deg, #4b5560, #66707b); --done-text: #ffffff;
    --head-bg: #0e6b47; --head-text: #ffffff; --hero: linear-gradient(150deg, #0e6b47, #138a5c);
    --shadow: 0 1px 2px rgba(23, 32, 27, .06), 0 6px 18px rgba(23, 32, 27, .07); --shadow-up: 0 -6px 24px rgba(23, 32, 27, .12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1412; --panel: #171e1b; --text: #e8ece9; --muted: #9aa69f; --line: #26302c; --soft: #1e2724;
      --accent: #3cc48a; --accent-2: #57d39d; --accent-text: #06170f; --ok-bg: #173326; --orange: #ff9d5c;
      --warn: #f0b04a; --warn-bg: #3a2c12; --bad: #f2786d; --bad-bg: #3d1d1b;
      --head-bg: #123a2b; --head-text: #e8ece9; --hero: linear-gradient(150deg, #123a2b, #1a5a41);
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 18px rgba(0, 0, 0, .35); --shadow-up: 0 -6px 24px rgba(0, 0, 0, .5);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; min-height: 100dvh;
         padding-bottom: calc(110px + env(safe-area-inset-bottom)); -webkit-font-smoothing: antialiased; }
  header { position: sticky; top: 0; z-index: 2; display: flex; justify-content: space-between; align-items: center; gap: 12px;
           padding: calc(12px + env(safe-area-inset-top)) 16px 14px; background: var(--head-bg); color: var(--head-text);
           box-shadow: 0 2px 12px rgba(14, 107, 71, .25); }
  header .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  header .logo { width: 34px; height: 34px; border-radius: 11px; background: rgba(255, 255, 255, .16); display: grid; place-items: center; flex: none; }
  header b { font-size: 18px; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .muted { color: inherit; opacity: .82; font-size: 14px; background: rgba(255, 255, 255, .14); padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
  main { max-width: 560px; margin: 0 auto; padding: 14px 16px; }
  .card { background: var(--panel); border-radius: 18px; padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .muted { color: var(--muted); }
  h2 { font-size: 17px; margin: 0 0 12px; letter-spacing: -.01em; }
  .viewer { position: relative; aspect-ratio: 4 / 3; background: #0b0f0d; border-radius: 16px; overflow: hidden; }
  .viewer video { width: 100%; height: 100%; object-fit: cover; }
  .viewer .frame { position: absolute; inset: 24% 12%; border-radius: 16px; box-shadow: 0 0 0 9999px rgba(0, 0, 0, .35);
                   border: 3px solid rgba(255, 255, 255, .9); }
  .viewer .frame::after { content: ""; position: absolute; left: 8%; right: 8%; top: 50%; height: 2px; background: var(--orange);
                          box-shadow: 0 0 12px var(--orange); animation: scanline 1.8s ease-in-out infinite alternate; }
  @keyframes scanline { from { transform: translateY(-38px); } to { transform: translateY(38px); } }
  .viewer .hint { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; color: #fff; font-size: 14px; font-weight: 600;
                  text-shadow: 0 1px 2px #000; }
  .viewer.idle { display: grid; place-items: center; background: var(--hero); }
  .viewer.idle button { background: var(--panel); color: var(--accent); padding: 14px 22px; border-radius: 16px; font-size: 17px;
                        box-shadow: 0 8px 24px rgba(0, 0, 0, .18); }
  button { font: inherit; font-weight: 650; border: 0; border-radius: 14px; padding: 12px 16px; cursor: pointer;
           background: var(--accent); color: var(--accent-text); transition: transform .08s ease; }
  button:active:not(:disabled) { transform: scale(.97); }
  button.secondary { background: var(--ok-bg); color: var(--accent); }
  button.link { background: none; color: var(--accent); padding: 8px 0; font-weight: 600; }
  button:disabled { opacity: .45; cursor: default; }
  .row { display: flex; gap: 8px; align-items: center; }
  .grow { flex: 1; min-width: 0; }
  select, textarea { font: inherit; width: 100%; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 13px;
                     background: var(--panel); color: var(--text); }
  textarea { resize: vertical; min-height: 90px; }
  details.report summary { cursor: pointer; font-weight: 650; color: var(--accent); list-style: none; }
  details.report summary::-webkit-details-marker { display: none; }
  details.report label { display: block; font-size: 14px; font-weight: 650; margin: 12px 0 6px; }
  input { font: inherit; width: 100%; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 13px;
          background: var(--panel); color: var(--text); }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--ok-bg); }
  .msg { padding: 12px 14px; border-radius: 14px; margin-bottom: 14px; font-weight: 500; }
  .msg.bad { background: var(--bad-bg); color: var(--bad); }
  .msg.ok { background: var(--ok-bg); color: var(--accent); }
  .line { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: center; }
  .line:last-child { border-bottom: 0; }
  .qty { display: inline-flex; align-items: center; gap: 2px; background: var(--soft); border-radius: 999px; padding: 3px; }
  .line .qty { justify-self: start; }
  .qty button { width: 32px; height: 32px; padding: 0; border-radius: 50%; background: transparent; color: var(--text); font-size: 20px; line-height: 1; }
  .qty span { min-width: 26px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
  .num { font-variant-numeric: tabular-nums; text-align: right; }
  .bar { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 2; max-width: 536px; margin: 0 auto;
         background: var(--text); color: var(--bg); border-radius: 20px; padding: 10px 10px 10px 18px; box-shadow: var(--shadow-up); }
  .bar .inner { display: flex; gap: 12px; align-items: center; }
  .bar .total { flex: 1; }
  .bar .total .muted { color: inherit; opacity: .7; font-size: 14px; }
  .bar .total b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .bar button { background: var(--accent-2); color: #fff; padding: 13px 20px; border-radius: 15px; }
  @media (prefers-color-scheme: dark) { .bar button { color: var(--accent-text); } }
  .center { text-align: center; }
  .spinner { width: 76px; height: 76px; margin: 10px auto 14px; border-radius: 24px; background: var(--ok-bg); position: relative; animation: bob 1.6s ease-in-out infinite; }
  .spinner::after { content: ""; position: absolute; inset: 18px 24px; border: 3px solid var(--accent); border-radius: 6px; }
  @keyframes bob { 50% { transform: translateY(-6px); } }
  .pass { background: linear-gradient(150deg, var(--accent), var(--accent-2)); color: #fff; border-radius: 24px; padding: 22px 18px; text-align: center;
          margin-bottom: 14px; box-shadow: 0 10px 30px rgba(14, 107, 71, .3); }
  @media (prefers-color-scheme: dark) { .pass { color: var(--accent-text); } }
  .pass .big { font-size: 36px; font-weight: 850; letter-spacing: .04em; }
  .pass .code { font: 700 22px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .14em; margin: 6px 0; }
  .pass .clock { font-variant-numeric: tabular-nums; font-size: 18px; font-weight: 600; }
  .pass .qr { display: inline-block; background: #fff; padding: 10px; border-radius: 16px; margin: 8px 0 10px; line-height: 0; }
  .pass .qr img { width: 180px; height: 180px; max-width: 100%; }
  .pass.done { background: var(--done-bg); color: var(--done-text); box-shadow: none; }
  .pulse { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: currentColor; margin-right: 6px;
           animation: pulse 1.2s ease-in-out infinite; vertical-align: middle; }
  @keyframes pulse { 50% { opacity: .2; transform: scale(.6); } }
  .warnbox { background: var(--warn-bg); color: var(--warn); }
  .choice { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .choice label { display: flex; align-items: center; gap: 10px; padding: 14px; border: 1.5px solid var(--line); border-radius: 15px;
                  font-weight: 650; cursor: pointer; background: var(--panel); }
  .choice label:has(input:checked) { border-color: var(--accent); background: var(--ok-bg); }
  .choice input { width: 20px; height: 20px; margin: 0; accent-color: var(--accent); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  [hidden] { display: none !important; }
</style>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%230e6b47%27/%3E%3Cpath d=%27M9 12h14l-1 11a2 2 0 0 1-2 2h-8a2 2 0 0 1-2-2zM13 13v-2a3 3 0 0 1 6 0v2%27 fill=%27none%27 stroke=%27white%27 stroke-width=%272%27 stroke-linecap=%27round%27/%3E%3C/svg%3E">
</head>
<body>
<header><span class="brand"><span class="logo" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2M8 8v8M11 8v8M14 8v8M17 8v8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span><b id="store-name">Scan &amp; Go</b></span><span class="muted" id="step-label">Scan</span></header>

<main>
  <div id="msg" class="msg" hidden></div>

  <!-- 1. Scanning -->
  <section id="scan-view">
    <div class="card">
      <div id="viewer" class="viewer idle"><button id="start-camera">Start scanning</button></div>
      <form id="manual" class="row" style="margin-top:10px">
        <input class="grow" id="manual-code" inputmode="numeric" pattern="\d{13}" maxlength="13"
               placeholder="Or type the barcode number" aria-label="Barcode number" autocomplete="off">
        <button class="secondary">Add</button>
      </form>
    </div>
    <div class="card">
      <h2>Your basket</h2>
      <div id="basket"></div>
    </div>
  </section>

  <!-- 2. Phone number -->
  <section id="phone-view" hidden>
    <div class="card">
      <h2 id="pay-title">Pay with M-Pesa</h2>
      <div class="choice" id="pay-method" hidden>
        <label><input type="radio" name="paymethod" value="mpesa" checked> M-Pesa</label>
        <label><input type="radio" name="paymethod" value="card"> Card</label>
      </div>
      <p class="muted" style="margin-top:0" id="pay-hint">We'll send a payment request to this phone. Enter your M-Pesa PIN there to pay.</p>
      <form id="phone-form">
        <input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="0712 345 678" aria-label="M-Pesa phone number" required>
        <input id="email" type="email" autocomplete="email" placeholder="you@example.com" aria-label="Email for the card receipt" hidden>
        <button style="width:100%;margin-top:12px" id="pay-button">Pay</button>
      </form>
      <button class="link" id="back-to-basket">← Back to basket</button>
    </div>
  </section>

  <!-- 3. Waiting for payment -->
  <section id="wait-view" hidden>
    <div class="card center">
      <div class="spinner"></div>
      <h2 id="wait-title">Check your phone</h2>
      <p class="muted" id="wait-text">Enter your M-Pesa PIN to pay.</p>
    </div>
    <div class="card warnbox" id="retry-box" hidden>
      <p id="retry-text" style="margin-top:0"></p>
      <form id="retry-form">
        <input id="retry-phone" type="tel" inputmode="tel" placeholder="0712 345 678" aria-label="M-Pesa phone number" required>
        <button style="width:100%;margin-top:10px">Pay with M-Pesa</button>
      </form>
      <form id="retry-card-form" hidden style="margin-top:14px">
        <input id="retry-email" type="email" placeholder="you@example.com" aria-label="Email for the card receipt" required>
        <button style="width:100%;margin-top:10px">Pay by card</button>
      </form>
      <button class="link" id="abandon">Start a new basket</button>
    </div>
  </section>

  <!-- 4. Receipt / exit pass -->
  <section id="receipt-view" hidden>
    <div class="pass" id="pass">
      <div class="big" id="pass-title">PAID</div>
      <div class="code" id="pass-code"></div>
      <div class="qr"><img id="pass-qr" alt="Order QR code for the exit check" width="180" height="180"></div>
      <div class="clock" id="pass-live"><span class="pulse"></span><span id="pass-clock"></span></div>
      <div style="margin-top:6px;opacity:.9" id="pass-hint">Show this screen at the exit</div>
    </div>
    <div class="card">
      <h2 id="receipt-store"></h2>
      <div id="receipt-lines"></div>
      <div class="line"><b>Total</b><b class="num" id="receipt-total"></b></div>
      <p class="muted" id="receipt-meta" style="margin-bottom:0"></p>
    </div>
    <button class="secondary" style="width:100%" id="new-basket">Start a new basket</button>
  </section>

  <details class="card report" id="report" hidden>
    <summary>Something not right? Report a problem</summary>
    <form id="report-form" novalidate>
      <label for="r-kind">What is it about?</label>
      <select id="r-kind"><option value="">Choose</option><option value="app">The app isn't working</option>
        <option value="store">Something in the store</option><option value="order">My purchase</option><option value="idea">An idea</option></select>
      <label for="r-message">What happened?</label>
      <textarea id="r-message" maxlength="2000" placeholder="Tell us in your own words"></textarea>
      <label for="r-contact">How can we reach you? <span class="muted" style="font-weight:500">(optional)</span></label>
      <input id="r-contact" maxlength="120" placeholder="Phone or email">
      <button style="width:100%;margin-top:12px" id="r-send">Send</button>
      <p class="muted" id="r-done" hidden style="margin-bottom:0"></p>
    </form>
  </details>
</main>

<div class="bar" id="checkout-bar">
  <div class="inner">
    <div class="total"><span class="muted" id="count">0 items</span><b id="total">KES 0</b></div>
    <button id="checkout" disabled>Checkout</button>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const kes = (n) => "KES " + Number(n || 0).toLocaleString("en-KE");
const POLL_MS = 2500;
const EXIT_POLL_MS = 5000;
const ZXING_URL = "https://cdn.jsdelivr.net/npm/@zxing/library@0.23.0/umd/index.min.js";

// Browser storage can be unavailable (private mode, blocked site data): fall back to memory.
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};

let basket = store.get("sg.basket", []);  // [{product_id, ean13, name, price, qty}]
let order = store.get("sg.order", null);  // {order_id, payment_id, total, phone}
let pollTimer = null, clockTimer = null, cardOn = false, cardPolls = 0;
const payMethod = () => cardOn ? document.querySelector('input[name="paymethod"]:checked').value : "mpesa";

function renderPayMethod() {
  const card = payMethod() === "card";
  $("pay-title").textContent = card ? "Pay by card" : "Pay with M-Pesa";
  $("pay-hint").textContent = card ? "You'll go to a secure card payment page, then come back here for your receipt."
    : "We'll send a payment request to this phone. Enter your M-Pesa PIN there to pay.";
  $("phone").hidden = card; $("phone").required = !card;
  $("email").hidden = !card; $("email").required = card;
}
document.querySelectorAll('input[name="paymethod"]').forEach((r) => r.addEventListener("change", renderPayMethod));

function say(text, kind = "bad") {
  const m = $("msg");
  m.hidden = !text;
  m.className = "msg " + kind;
  m.textContent = text || "";
  if (text) window.scrollTo({top: 0, behavior: "smooth"});
}

async function api(path, options = {}) {
  const r = await fetch(path, {headers: {"Content-Type": "application/json"}, ...options});
  const body = await r.json().catch(() => ({}));
  if (!r.ok) {
    const detail = Array.isArray(body.detail) ? "Please check what you entered." : body.detail;
    throw Object.assign(new Error(detail || "Something went wrong. Please try again."), {status: r.status});
  }
  return body;
}

function show(view) {
  for (const v of ["scan", "phone", "wait", "receipt"]) $(v + "-view").hidden = v !== view;
  $("checkout-bar").hidden = view !== "scan";
  $("step-label").textContent = {scan: "Scan", phone: "Pay", wait: "Paying", receipt: "Receipt"}[view];
  if (view !== "scan") stopCamera();
}

// ------------------------------------------------------------------ basket

function renderBasket() {
  store.set("sg.basket", basket);
  const items = basket.reduce((n, l) => n + l.qty, 0);
  const total = basket.reduce((n, l) => n + l.qty * l.price, 0);
  $("count").textContent = items === 1 ? "1 item" : items + " items";
  $("total").textContent = kes(total);
  $("checkout").disabled = items === 0;
  $("basket").innerHTML = basket.length ? basket.map((l, i) => `
    <div class="line">
      <div>${esc(l.name)}<div class="muted">${kes(l.price)} each${l.was_price ? ` <s>${kes(l.was_price)}</s> <b style="color:#d92d20">offer</b>` : ""}</div></div>
      <div class="num"><b>${kes(l.qty * l.price)}</b></div>
      <div class="qty"><button aria-label="One less" data-i="${i}" data-d="-1">−</button><span>${l.qty}</span>
        <button aria-label="One more" data-i="${i}" data-d="1">+</button></div>
    </div>`).join("") : `<p class="muted" style="margin:0">Scan a product's barcode to add it.</p>`;
}

$("basket").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-i]");
  if (!b) return;
  const line = basket[+b.dataset.i];
  line.qty += +b.dataset.d;
  if (line.qty <= 0) basket.splice(+b.dataset.i, 1);
  renderBasket();
});

let lastCode = "", lastAt = 0;
async function addByBarcode(code) {
  const now = Date.now();
  if (code === lastCode && now - lastAt < 2500) return;  // the camera reads the same code many times a second
  lastCode = code; lastAt = now;
  try {
    const p = await api(`api/products/${encodeURIComponent(code)}`);
    const line = basket.find((l) => l.product_id === p.product_id);
    if (line) line.qty += 1; else basket.push({...p, qty: 1});
    renderBasket();
    say(`Added ${p.name}`, "ok");
    setTimeout(() => { if ($("msg").textContent === `Added ${p.name}`) say(""); }, 1800);
    if (navigator.vibrate) navigator.vibrate(60);
  } catch (err) {
    say(err.message);
  }
}

$("manual").addEventListener("submit", (e) => {
  e.preventDefault();
  const code = $("manual-code").value.replace(/\D/g, "");
  if (code.length !== 13) return say("A barcode has 13 digits.");
  lastCode = "";
  $("manual-code").value = "";
  addByBarcode(code);
});

// ------------------------------------------------------------------ camera

let stream = null, scanning = false, zxingReader = null;

async function startCamera() {
  say("");
  if (!navigator.mediaDevices?.getUserMedia) return say("This browser can't use the camera. Type the barcode number instead.");
  try {
    stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: "environment"}, audio: false});
  } catch {
    return say("Camera access was blocked. Allow it in your browser settings, or type the barcode number.");
  }
  $("viewer").className = "viewer";
  $("viewer").innerHTML = `<video playsinline muted></video><div class="frame"></div><div class="hint">Point at a barcode</div>`;
  const video = $("viewer").querySelector("video");
  video.srcObject = stream;
  await video.play();
  scanning = true;

  if ("BarcodeDetector" in window && (await BarcodeDetector.getSupportedFormats()).includes("ean_13")) {
    const detector = new BarcodeDetector({formats: ["ean_13"]});
    const tick = async () => {
      if (!scanning) return;
      try {
        const [hit] = await detector.detect(video);
        if (hit) addByBarcode(hit.rawValue);
      } catch {}
      setTimeout(tick, 250);
    };
    tick();
  } else {
    // iPhones and some browsers have no BarcodeDetector: use the ZXing library instead.
    try {
      if (!window.ZXing) await new Promise((ok, fail) => {
        const s = document.createElement("script");
        s.src = ZXING_URL; s.onload = ok; s.onerror = fail; document.head.appendChild(s);
      });
      const hints = new Map([[ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.EAN_13]]]);
      zxingReader = new ZXing.BrowserMultiFormatReader(hints, 250);
      zxingReader.decodeFromStream(stream, video, (result) => { if (result && scanning) addByBarcode(result.getText()); });
    } catch {
      say("The barcode scanner couldn't load. Type the barcode number instead.");
    }
  }
}

function stopCamera() {
  scanning = false;
  if (zxingReader) { try { zxingReader.reset(); } catch {} zxingReader = null; }
  if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; }
  $("viewer").className = "viewer idle";
  $("viewer").innerHTML = `<button id="start-camera">Start scanning</button>`;
}

$("viewer").addEventListener("click", (e) => { if (e.target.id === "start-camera") startCamera(); });

// ------------------------------------------------------------------ checkout and payment

$("checkout").addEventListener("click", () => {
  say("");
  $("phone").value = store.get("sg.phone", "");
  $("email").value = store.get("sg.email", "");
  show("phone");
  renderPayMethod();
  $("phone").focus();
});
$("back-to-basket").addEventListener("click", () => show("scan"));

$("phone-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("pay-button").disabled = true;
  say("");
  try {
    const method = payMethod(), phone = $("phone").value.trim(), email = $("email").value.trim();
    const r = await api("api/checkout", {method: "POST", body: JSON.stringify({
      method, ...(method === "card" ? {email} : {phone}), items: basket.map((l) => ({product_id: l.product_id, qty: l.qty}))})});
    if (method === "card") store.set("sg.email", email); else store.set("sg.phone", phone);
    order = {order_id: r.order_id, payment_id: r.payment_id, total: r.total, phone, email, method};
    store.set("sg.order", order);
    if (r.checkout_url) return goToCardPage(r.checkout_url);
    waitForPayment();
  } catch (err) {
    say(err.message);
  } finally {
    $("pay-button").disabled = false;
  }
});

// The card provider's page takes the card details; the phone comes back here (?order=...) afterwards.
function goToCardPage(url) {
  show("wait");
  $("wait-title").textContent = "Opening the card payment page…";
  $("wait-text").textContent = "";
  location.href = url;
}

function waitForPayment() {
  show("wait");
  $("retry-box").hidden = true;
  cardPolls = 0;
  const card = order.method === "card";
  $("wait-title").textContent = card ? "Confirming your card payment" : "Check your phone";
  $("wait-text").textContent = card ? `Checking your payment of ${kes(order.total)}…`
    : `Enter your M-Pesa PIN on your phone to pay ${kes(order.total)}.`;
  clearTimeout(pollTimer);
  poll();
}

function offerRetry(text) {
  $("retry-box").hidden = false;
  $("retry-text").textContent = text;
  $("retry-phone").value = order.phone || store.get("sg.phone", "");
  $("retry-card-form").hidden = !cardOn;
  $("retry-email").value = order.email || store.get("sg.email", "");
}

async function poll() {
  if (!order) return;
  try {
    const s = await api(`api/orders/${order.order_id}/payments/${order.payment_id}`);
    if (s.payment_status === "paid") return showReceipt(s);
    if (s.payment_status === "failed" || s.payment_status === "cancelled") {
      return offerRetry(s.payment_method === "card"
        ? `The card payment didn't go through${s.result ? ` (${s.result})` : ""}. Nothing was charged.`
        : s.payment_status === "cancelled"
        ? "The payment was cancelled on your phone. Nothing was charged."
        : `The payment didn't go through${s.result ? ` (${s.result})` : ""}. Nothing was charged.`);
    }
    // Back from the card page without paying: after a few checks, offer to try again.
    if (s.payment_method === "card" && s.payment_status === "pending" && ++cardPolls === 4) {
      offerRetry("The card payment wasn't completed. Nothing was charged. Try again, or pay another way.");
    }
  } catch (err) {
    if (err.status === 404) return reset();
  }
  pollTimer = setTimeout(poll, POLL_MS);
}

async function payAgain(body) {
  say("");
  try {
    const r = await api(`api/orders/${order.order_id}/pay`, {method: "POST", body: JSON.stringify(body)});
    order = {...order, payment_id: r.payment_id, method: body.method, phone: body.phone || order.phone, email: body.email || order.email};
    store.set("sg.order", order);
    if (r.checkout_url) return goToCardPage(r.checkout_url);
    waitForPayment();
  } catch (err) {
    say(err.message);
  }
}
$("retry-form").addEventListener("submit", (e) => { e.preventDefault(); payAgain({method: "mpesa", phone: $("retry-phone").value.trim()}); });
$("retry-card-form").addEventListener("submit", (e) => { e.preventDefault(); payAgain({method: "card", email: $("retry-email").value.trim()}); });

function showReceipt(s) {
  clearTimeout(pollTimer);
  show("receipt");
  basket = [];
  store.del("sg.basket");
  renderBasket();
  $("pass-code").textContent = s.order_id.slice(-8);
  const qr = `api/orders/${encodeURIComponent(s.order_id)}/qr.svg`;
  if (!$("pass-qr").src.endsWith(qr)) $("pass-qr").src = qr;
  $("receipt-store").textContent = s.store_name;
  $("receipt-lines").innerHTML = s.lines.map((l) => `
    <div class="line"><div>${l.qty} × ${esc(l.name)}</div><div class="num">${kes(l.line_total)}</div></div>`).join("");
  $("receipt-total").textContent = kes(s.amount ?? s.total);
  const paid = s.paid_at ? new Date(s.paid_at) : null;
  $("receipt-meta").textContent = [
    paid && !isNaN(paid) ? "Paid " + paid.toLocaleString([], {dateStyle: "medium", timeStyle: "short"}) : "",
    s.mpesa_receipt ? "M-Pesa " + s.mpesa_receipt : "",
    s.card ? "Paid by card " + s.card : s.phone, "Order " + s.order_id,
  ].filter(Boolean).join(" · ");
  clearInterval(clockTimer);
  if (s.exited_at) {
    // Checked at the exit: the pass can't be used again.
    const left = new Date(s.exited_at);
    $("pass").classList.add("done");
    $("pass-title").textContent = "CHECKED OUT";
    $("pass-live").hidden = true;
    $("pass-hint").textContent = "Left the store at " + (isNaN(left) ? "" : left.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"})) + ". Thank you!";
    return;
  }
  $("pass").classList.remove("done");
  $("pass-title").textContent = "PAID";
  $("pass-live").hidden = false;
  $("pass-hint").textContent = "Show this screen at the exit";
  // A live clock on the pass makes an old screenshot easy to spot at the exit.
  const tickClock = () => { $("pass-clock").textContent = new Date().toLocaleTimeString([], {hour: "2-digit", minute: "2-digit", second: "2-digit"}); };
  tickClock();
  clockTimer = setInterval(tickClock, 1000);
  // Keep checking, so the pass turns grey as soon as staff check it at the exit.
  pollTimer = setTimeout(poll, EXIT_POLL_MS);
}

function reset() {
  clearTimeout(pollTimer);
  clearInterval(clockTimer);
  order = null;
  store.del("sg.order");
  say("");
  show("scan");
  renderBasket();
}
$("new-basket").addEventListener("click", reset);
$("abandon").addEventListener("click", reset);

// ------------------------------------------------------------------ start

// Report a problem. For "the app isn't working", the screen and recent errors go along to help fix it.
const recentErrors = [];
window.addEventListener("error", (e) => { recentErrors.push(String(e.message).slice(0, 200)); recentErrors.splice(0, recentErrors.length - 3); });
$("report-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const kind = $("r-kind").value, message = $("r-message").value.trim();
  if (!kind || message.length < 5) { $("r-done").hidden = false; $("r-done").textContent = "Choose what it's about and tell us what happened."; return; }
  $("r-send").disabled = true;
  try {
    const visible = ["scan", "phone", "wait", "receipt"].find((v) => !$(v + "-view").hidden) || "";
    const r = await api("api/reports", {method: "POST", body: JSON.stringify({kind, message, contact: $("r-contact").value.trim(),
      order_id: order?.order_id || "", context: kind === "app" ? {page: visible, screen: `${innerWidth}x${innerHeight}`, errors: recentErrors.join(" | ")} : {}})});
    $("report-form").reset();
    $("r-done").hidden = false;
    $("r-done").textContent = `Thanks, we've got it (reference ${r.report_id}). A member of staff can help you right away too.`;
  } catch (err) { $("r-done").hidden = false; $("r-done").textContent = err.message; }
  $("r-send").disabled = false;
});

api("api/store").then((s) => {
  $("report").hidden = !s.reports;
  $("store-name").textContent = s.name;
  document.title = `Scan & Go · ${s.name}`;
  cardOn = s.card;
  $("pay-method").hidden = !cardOn;
}).catch(() => {});
renderBasket();
// Coming back from the card page: the address has ?order=...; the order itself is remembered on this phone.
if (new URLSearchParams(location.search).get("order")) history.replaceState(null, "", location.pathname);
if (order) waitForPayment(); else show("scan");
</script>
</body>
</html>
