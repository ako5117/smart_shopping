<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f7a4d">
<title>Rider</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1b1f24; --muted: #646d78; --line: #e3e6ea;
    --accent: #1f7a4d; --accent-text: #ffffff; --warn: #9a5b00; --warn-bg: #fff4e0; --bad: #b42318; --bad-bg: #fdecea;
    --ok-bg: #e7f5ee; --chip: #eef0f3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151a; --panel: #1b1f26; --text: #e6e8eb; --muted: #9aa3ad; --line: #2c323b;
      --accent: #4cc38a; --accent-text: #0d1f16; --warn: #f0a640; --warn-bg: #3a2c12; --bad: #f2786d; --bad-bg: #3d1d1b;
      --ok-bg: #173327; --chip: #262b33;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; min-height: 100dvh; }
  header { position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 1px solid var(--line);
           padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  header b { font-size: 17px; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
  .muted { color: var(--muted); }
  .small { font-size: 14px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 18px 0 8px; }
  button, .btn { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 11px 14px; cursor: pointer;
           background: var(--accent); color: var(--accent-text); text-decoration: none; display: inline-block; text-align: center; }
  button.secondary, .btn.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  button.danger { background: transparent; color: var(--bad); border: 1px solid var(--bad); }
  button:disabled { opacity: .5; cursor: default; }
  input, select { font: inherit; width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px;
          background: var(--bg); color: var(--text); }
  .row { display: flex; gap: 8px; align-items: center; }
  .grow { flex: 1; min-width: 0; }
  .msg { padding: 10px 12px; border-radius: 10px; margin-bottom: 14px; }
  .msg.bad { background: var(--bad-bg); color: var(--bad); }
  .msg.ok { background: var(--ok-bg); color: var(--accent); }
  .pill { display: inline-block; font-size: 13px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--chip); }
  .pill.go { background: var(--ok-bg); color: var(--accent); }
  .pill.wait { background: var(--warn-bg); color: var(--warn); }
  .pill.bad { background: var(--bad-bg); color: var(--bad); }
  .job { display: grid; gap: 8px; }
  .job .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .job .code { font: 700 16px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .08em; }
  .job .addr { font-size: 17px; font-weight: 600; }
  .job .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pin { font: 700 24px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .4em; text-align: center; }
  .shift { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
  .dot.on { background: var(--accent); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header><b id="store-name">Rider</b><span class="muted small" id="who"></span></header>
<main>
  <div id="msg" class="msg" hidden></div>

  <div class="card">
    <div class="shift">
      <div><span class="dot" id="shift-dot"></span><b id="shift-text">Off shift</b>
        <div class="muted small" id="shift-hint">Start your shift to see deliveries waiting for a rider.</div></div>
      <button id="shift">Start shift</button>
    </div>
    <form id="phone-form" class="row" style="margin-top:12px">
      <input class="grow" id="phone" type="tel" inputmode="tel" placeholder="Your phone, e.g. 0722 000 111" aria-label="Your phone number">
      <button class="secondary">Save</button>
    </form>
    <div class="muted small" style="margin-top:6px">Customers see this number so they can call you.</div>
  </div>

  <h2>My deliveries</h2>
  <div id="mine"><div class="muted">None right now.</div></div>

  <h2 id="available-title">Waiting for a rider</h2>
  <div id="available"></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const kes = (n) => "KES " + Number(n || 0).toLocaleString("en-KE");
const ago = (iso) => { const m = Math.round((Date.now() - new Date(iso)) / 60000); return isNaN(m) ? "" : m < 1 ? "just now" : `${m} min ago`; };
let me = null, timer = null;

function say(text, kind = "bad") {
  const m = $("msg");
  m.hidden = !text;
  m.className = "msg " + kind;
  m.textContent = text || "";
  if (text) window.scrollTo({top: 0, behavior: "smooth"});
}

async function api(path, options = {}) {
  const r = await fetch(path, {headers: {"Content-Type": "application/json"}, ...options});
  const body = await r.json().catch(() => ({}));
  if (!r.ok) {
    const detail = Array.isArray(body.detail) ? "Please check what you entered." : body.detail;
    throw Object.assign(new Error(detail || "Something went wrong. Try again."), {status: r.status});
  }
  return body;
}

function renderMe() {
  $("store-name").textContent = me.store_name || "Rider";
  $("who").textContent = me.rider_id;
  $("shift-dot").classList.toggle("on", me.on_shift);
  $("shift-text").textContent = me.on_shift ? "On shift" : "Off shift";
  $("shift-hint").textContent = me.on_shift ? "New deliveries show up below. End your shift when you stop."
    : "Start your shift to see deliveries waiting for a rider.";
  $("shift").textContent = me.on_shift ? "End shift" : "Start shift";
  $("shift").className = me.on_shift ? "secondary" : "";
  if (document.activeElement !== $("phone")) $("phone").value = me.phone || "";
  $("available-title").hidden = !me.on_shift;
}

const STATUS = {assigned: ["Collect at the counter", "wait"], picked_up: ["Delivering", "go"], failed: ["Problem reported", "bad"]};

function job(j) {
  const [label, kind] = STATUS[j.status];
  let actions = "";
  if (j.status === "assigned") {
    actions = `<div class="muted small">Go to the store counter with code <b>${esc(j.code)}</b>. Staff hand you the parcel.</div>
      <div class="actions"><a class="btn secondary" href="${esc(j.maps)}" target="_blank" rel="noopener">Map</a>
        <button class="danger" data-release="${esc(j.sale_id)}">Give back</button></div>`;
  } else if (j.status === "picked_up" && j.locked) {
    actions = `<div class="pill bad">Too many wrong codes. Call the store.</div>`;
  } else if (j.status === "picked_up") {
    actions = `<form class="row" data-deliver="${esc(j.sale_id)}">
        <input class="grow pin" inputmode="numeric" maxlength="4" pattern="\\d{4}" required placeholder="····" aria-label="Customer's delivery code">
        <button>Delivered</button></form>
      <div class="muted small">Ask the customer for the 4-digit code on their order page.</div>
      <div class="actions"><a class="btn secondary" href="${esc(j.maps)}" target="_blank" rel="noopener">Map</a>
        <button class="danger" data-problem="${esc(j.sale_id)}">Problem</button></div>`;
  } else {
    actions = `<div class="muted small">“${esc(j.fail_reason)}”. The store will call the customer and tell you what to do.</div>`;
  }
  return `<div class="card job">
    <div class="head"><span class="code">${esc(j.code)}</span><span class="pill ${kind}">${label}</span></div>
    <div class="addr">${esc(j.address)}</div>
    <div class="muted">${esc(j.area)}${j.notes ? " · " + esc(j.notes) : ""}</div>
    <div class="row" style="justify-content:space-between"><span>${esc(j.customer_name)}${j.items ? ` · ${j.items} item${j.items === 1 ? "" : "s"}` : ""}</span>
      <a href="tel:${esc(j.customer_phone)}" class="btn secondary" style="padding:6px 12px">Call</a></div>
    ${actions}
  </div>`;
}

async function load() {
  clearTimeout(timer);
  try {
    me = await api("api/me");
    renderMe();
    const jobs = await api("api/jobs");
    const typing = document.activeElement && document.activeElement.classList.contains("pin");
    if (!typing) $("mine").innerHTML = jobs.mine.length ? jobs.mine.map(job).join("") : `<div class="muted">None right now.</div>`;
    $("available").innerHTML = !me.on_shift ? "" : jobs.available.length ? jobs.available.map((j) => `
      <div class="card row"><div class="grow"><b>${esc(j.area)}</b><div class="muted small">Order ${esc(j.code)} · paid ${ago(j.created_at)} · delivery ${kes(j.fee)}</div></div>
        <button data-accept="${esc(j.sale_id)}">Accept</button></div>`).join("") : `<div class="muted">Nothing waiting.</div>`;
  } catch (err) {
    say(err.message);
  }
  timer = setTimeout(load, 10000);
}

$("shift").addEventListener("click", async () => {
  if (!me.on_shift && !me.phone && !$("phone").value.trim()) return say("Save your phone number first, so customers can call you.");
  try {
    me = await api("api/me", {method: "PUT", body: JSON.stringify({on_shift: !me.on_shift})});
    say("");
  } catch (err) { say(err.message); }
  load();
});

$("phone-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  try {
    me = await api("api/me", {method: "PUT", body: JSON.stringify({phone: $("phone").value.trim()})});
    say("Phone number saved.", "ok");
  } catch (err) { say(err.message); }
  load();
});

document.addEventListener("click", async (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  try {
    if (b.dataset.accept) {
      b.disabled = true;
      await api(`api/jobs/${encodeURIComponent(b.dataset.accept)}/accept`, {method: "POST"});
      say("It's yours. Go to the store counter to collect it.", "ok");
    } else if (b.dataset.release) {
      if (!confirm("Give this delivery back? Another rider will take it.")) return;
      await api(`api/jobs/${encodeURIComponent(b.dataset.release)}/release`, {method: "POST"});
      say("");
    } else if (b.dataset.problem) {
      const reason = prompt("What went wrong? e.g. Customer not answering, wrong address");
      if (!reason) return;
      await api(`api/jobs/${encodeURIComponent(b.dataset.problem)}/problem`, {method: "POST", body: JSON.stringify({reason})});
      say("Reported. The store will call the customer.", "ok");
    } else return;
  } catch (err) { say(err.message); }
  load();
});

document.addEventListener("submit", async (e) => {
  const f = e.target.closest("form[data-deliver]");
  if (!f) return;
  e.preventDefault();
  const input = f.querySelector("input");
  try {
    await api(`api/jobs/${encodeURIComponent(f.dataset.deliver)}/delivered`, {method: "POST", body: JSON.stringify({pin: input.value})});
    input.blur();
    say("Delivered. Thank you!", "ok");
  } catch (err) {
    say(err.message);
    input.select();
    return;
  }
  load();
});

load();
</script>
</body>
</html>
